<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09070b">
  <meta name="robots" content="noindex, nofollow">
  <title>Under Maintenance ♡</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at center, #211522 0%, #100c13 45%, #070609 100%);
      color: #eee4ed;
      font-family: Georgia, "Times New Roman", serif;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        radial-gradient(1px 1px at 12% 20%, #fff, transparent),
        radial-gradient(1px 1px at 80% 15%, #d8b6db, transparent),
        radial-gradient(1px 1px at 68% 75%, #fff, transparent),
        radial-gradient(1px 1px at 25% 83%, #c9a6d1, transparent),
        radial-gradient(1px 1px at 91% 62%, #fff, transparent),
        radial-gradient(1px 1px at 43% 34%, #d8b6db, transparent);
      background-size: 240px 240px;
    }

    .panel {
      position: relative;
      width: 100%;
      max-width: 490px;
      padding: 48px 30px;
      text-align: center;
      background: rgba(15, 11, 18, 0.86);
      border: 1px solid #62475f;
      outline: 1px solid rgba(160, 118, 157, 0.17);
      outline-offset: 7px;
      box-shadow: 0 0 65px rgba(110, 58, 108, 0.12);
      animation: appear 1.1s ease both;
    }

    .ornament {
      color: #c7a1c4;
      font-size: 17px;
      letter-spacing: 7px;
    }

    .symbol {
      margin: 28px 0 20px;
      color: #d4afcf;
      font-size: 39px;
      animation: glow 3s ease-in-out infinite;
    }

    .eyebrow {
      margin-bottom: 17px;
      color: #b79bb7;
      font: 10px/1.8 Arial, sans-serif;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 20px;
      font-size: clamp(30px, 7vw, 43px);
      line-height: 1.2;
      font-weight: normal;
      letter-spacing: -1px;
    }

    .description {
      max-width: 330px;
      margin: 0 auto;
      color: #b8acbb;
      font: 13px/2 Arial, sans-serif;
      letter-spacing: 0.3px;
    }

    .divider {
      width: 65px;
      height: 1px;
      margin: 28px auto;
      background: linear-gradient(
        to right, transparent, #a982a7, transparent
      );
    }

    .footer {
      color: #8f7d91;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .footer span {
      color: #c89bbb;
    }

    @keyframes glow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .panel { padding: 42px 21px; }
      h1 { font-size: 31px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <main class="panel">
    <div class="ornament">† ───── ♡ ───── †</div>

    <div class="symbol">✧</div>

    <p class="eyebrow">A little pause in time</p>

    <h1>Under Maintenance</h1>

    <p class="description">
      This website is under maintainance it will be back soon thank you </3
      <br>
      <br>
      Everything will be back soon.
      Thank you for your patience.
    </p>

    <div class="divider"></div>

    <p class="footer">Made with <span>♡</span>, always.</p>

    <div class="ornament" style="margin-top: 30px;">
      † ───── ♡ ───── †
    </div>
  </main>
</body>
</html>
